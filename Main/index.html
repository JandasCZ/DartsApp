<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darts APP</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
</head>
<body>

<!-- MENU: NASTAVENÍ HRY + LEADERBOARD -->
<div id="setup-screen">
  <!-- Levý panel: Nastavení hry -->
  <div class="setup-card">
    <h1>🎯 Darts App</h1>

    <div class="form-group">
      <label for="game-mode">Režim hry</label>
      <select id="game-mode">
        <optgroup label="X01" class="group-x01">
          <option value="301">301</option>
          <option value="501" selected>501</option>
          <option value="701">701</option>
        </optgroup>
        <optgroup label="Ostatní" class="group-cricket">
          <option value="cricket">Cricket</option>
        </optgroup>
      </select>
    </div>

    <div class="form-group">
      <label for="player-count">Počet hráčů</label>
      <select id="player-count">
        <option value="1">1 hráč</option>
        <option value="2" selected>2 hráči</option>
        <option value="3">3 hráči</option>
        <option value="4">4 hráči</option>
      </select>
    </div>

    <div class="form-group">
      <label>Výběr hráčů (vyber z databáze nebo zadej nového)</label>
      <div id="player-names" class="player-inputs"></div>
    </div>

    <label class="checkbox-row" id="double-out-row">
      <input type="checkbox" id="double-out" />
      <span>Double Out (zavírání dvojnásobkem nebo středem)</span>
    </label>

    <div id="setup-error" class="setup-error"></div>
    <button class="btn-primary" id="start-btn">Spustit hru</button>
  </div>

  <!-- Pravý panel: Leaderboard -->
  <div class="leaderboard-card">
    <div class="lb-header">
      <h2>🏆 Leaderboard</h2>
      <div class="db-actions">
        <button class="btn-secondary btn-small" id="export-db-btn" title="Uložit databázi do JSON souboru">💾 Export JSON</button>
        <button class="btn-secondary btn-small" id="import-db-btn" title="Načíst databázi z JSON souboru">📂 Import JSON</button>
        <input type="file" id="import-db-file" accept=".json" hidden />
      </div>
    </div>
    <div class="lb-tabs">
      <button class="lb-tab active" data-tab="x01">🎯 x01 (301 / 501 / 701)</button>
      <button class="lb-tab" data-tab="cricket">🏏 Cricket</button>
    </div>

    <!-- Pedestály: Nejvíc výher -->
    <div class="podium-section">
      <div class="section-caption">Nejvíc výher</div>
      <div class="podium" id="wins-podium"></div>
    </div>

    <!-- Karty rekordů -->
    <div class="records-grid" id="records-grid"></div>

    <!-- Přehledová tabulka všech hráčů -->
    <div class="lb-table-wrap">
      <table class="lb-table">
        <thead id="lb-table-head"></thead>
        <tbody id="lb-table-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Spodní panel: Poslední odehrané hry -->
  <div class="recent-card">
    <div class="lb-header">
      <h2>🕒 Match History</h2>
    </div>
    <div class="recent-list" id="recent-games-list"></div>
  </div>
</div>

<!-- HERNÍ OBRAZOVKA -->
<div id="game-screen">
  <div class="board-container">
    <div id="hover-info">Klikni na plošku terče</div>
    <svg id="dartboard" viewBox="-275 -275 550 550"></svg>
    <div class="board-controls">
      <button class="btn-secondary" id="miss-btn">Vedle (0)</button>
      <button class="btn-secondary" id="undo-btn">↩ Zpět</button>
    </div>
  </div>

  <div class="sidebar">
    <div class="top-bar">
      <div class="mode-badge" id="mode-display"></div>
      <button class="btn-danger btn-small" id="new-game-btn">Zpět do menu</button>
    </div>

    <button class="btn-bulls" id="bulls-btn">🎯 Středy?</button>
    <button class="btn-end-early" id="end-game-btn">🏁 Ukončit hru?</button>

    <div id="status-banner"></div>

    <div class="turn-box" id="turn-box">
      <div class="label" id="turn-label">Aktuální kolo</div>
      <div class="dart-slots" id="dart-slots">
        <div class="dart-slot" id="slot-0">-</div>
        <div class="dart-slot" id="slot-1">-</div>
        <div class="dart-slot" id="slot-2">-</div>
      </div>
    </div>

    <div class="cricket-board" id="cricket-board"></div>
    <div class="players-grid" id="players-grid"></div>
  </div>
</div>

<!-- POPUP NA KONCI HRY -->
<div id="win-modal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-icon">🏆</div>
    <h2 id="win-title">Konec hry!</h2>
    <p id="win-subtitle"></p>
    <div class="modal-actions">
      <button class="btn-primary" id="rematch-btn">🔄 Opakovat hru</button>
      <button class="btn-secondary" id="minimize-modal-btn">🎯 Prohlédnout terč</button>
      <button class="btn-secondary" id="menu-btn">🏠 Zpět do menu</button>
    </div>
    <button class="btn-link" id="modal-undo-btn">↩ Omyl, vrátit poslední hod</button>
  </div>
</div>

<!-- MINIMALIZOVANÉ TLAČÍTKO V PRAVÉM DOLNÍM ROHU -->
<button id="restore-modal-btn" class="restore-modal-btn">
  <span>▲</span> Výsledky
</button>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/board.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/game.js"></script>

</body>
</html>
